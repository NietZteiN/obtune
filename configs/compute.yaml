# Host facts and compute policy. Last updated: 2026-08-28.
# Inherited from the monorepo charter (../CLAUDE.md).
#
# 2026-08-28 — MIGRATED. The project moved from csr-94608.utdallas.edu to juno.
# Nothing about the old host's compute policy survives the move, and the two
# differ in the way that matters most: csr-94608 had NO scheduler and was shared,
# informally, with a borrower on the same Unix account, so obtune carried its own
# GPU allocator, idle-detector and tmux supervisor. juno has SLURM. All of that
# machinery is now dead weight — see `legacy_scheduler_policy` at the bottom and
# log/setup/2026-08-28_juno-migration.md for the decision and its reasoning.

host: juno-l-02              # LOGIN node. No GPU here; nvidia-smi does not exist.
                             # Anything touching a GPU goes through SLURM.
scheduler: slurm             # was: none

slurm:
  version: "24.11.5"
  # Partition to use for GPU work unless a job has a reason not to. h200 is both
  # the largest pool and the fastest card, so it is the default rather than a
  # premium tier to be rationed.
  default_partition: h200
  max_walltime: "2-00:00:00" # every partition; jobs longer than this must checkpoint
  partitions:
    h200:
      nodes: 26              # g-07-[01-13], g-08-[01-13]
      gpus_per_node: 2       # nvidia_h200_nvl, 141 GB each
      gpu_total: 52
      cpus_per_node: 64
      mem_gb_per_node: 375
    h100:
      nodes: 3               # heterogeneous — check the node before assuming
      note: |
        g-04-02 = 4 x h100_80gb_hbm3 (512 GB RAM), g-05-01 = 1 x h100_nvl,
        g-06-01 = 4 x h100_nvl_3g.47gb (MIG slices, 47 GB). Only g-04-02 is a
        full-fat multi-GPU node.
    a30:
      nodes: 2               # g-01-01, g-02-01 — 2 x nvidia_a30 each
      note: closest analogue to the old A6000s; useful for cheap smoke tests
    a30-2.12gb:
      nodes: 1               # g-03-01 — 4 x MIG 2g.12gb
      note: 12 GB slices; too small for 1.5B bf16 training, fine for CPU-ish probes
    a30-4.6gb:
      nodes: 1               # g-04-01 — 8 x MIG 1g.6gb
    normal:
      nodes: 90              # CPU only — corpus building, merging, analysis
    dev:
      nodes: 8               # CPU only, 2 h limit — interactive debugging
  # Sensible per-job asks. Not a policy, a starting point: one GPU per job, since
  # the old feasibility work established that neither 1.5B nor 7B LoRA needs model
  # parallelism, and a single-GPU ask schedules far sooner than a 2-GPU one.
  defaults:
    partition: h200
    gres: "gpu:1"
    cpus_per_task: 8
    mem: "64G"
    time: "08:00:00"

paths:
  # Kept in sync BY HAND with scripts/env.sh, which is the source of truth for
  # the same three roots. If you relocate the project, change env.sh first and
  # then mirror it here; scripts/00_env_check.py compares them.
  env: /work/jvl210002/migration/envs/obtune-cu129
  python: /work/jvl210002/migration/envs/obtune-cu129/bin/python
  # cu129, not the lock's cu130: juno's driver is 550.163.01 (CUDA 12.4).
  # See CLAUDE.md §2 and log/setup/2026-08-28_cuda-driver-and-vllm.md.
  hf_home: /work/jvl210002/migration/hf_home
  tmpdir: /work/jvl210002/migration/tmp
  # R is a system module here, not a personal conda env: `module load R/4.5.0`.
  # The old r_analysis env (lme4, emmeans, the GLMM stack in stats/) did NOT move
  # and its packages must be reinstalled before anything under stats/ will run.
  rscript: /opt/ohpc/pub/libs/gnu14/R/4.5.0/bin/Rscript
  r_module: R/4.5.0
  # node is NOT installed on juno. js/node_modules transferred intact (814 MB,
  # javascript-obfuscator included) but has no interpreter to run it, so the H1
  # generator and anything JavaScript is blocked until a node toolchain is added.
  node: null

training_defaults:
  attn_implementation: sdpa # flash-attn 2.x has no wheel for torch 2.11; SDPA-flash is enough at ~1.5k ctx
  dtype: bfloat16
  gradient_checkpointing: true

exec_pool:
  workers: 32 # subprocess pool for the semantic gate / corpus building

# ---------------------------------------------------------------------------
# legacy_scheduler_policy — INERT. Retained so the reasoning is not lost, and so
# any straggler reading `scheduler_policy` fails loudly rather than silently
# picking up a GPU index that means nothing here.
#
# On csr-94608 this block was the durable lever for sharing four A6000s with a
# borrower who ran under the SAME Unix account (so uid was not an ownership
# test). `allowed_gpus` was a CANDIDATE set, not an assignment, because the
# borrower's job migrated between cards on 2026-08-12 and a hard-pinned pair left
# obtune on one working card beside an idle card it was forbidden to touch. The
# real protection was never this list but the worker's own idle check (>2 GB used
# or >5 % util). Full history: git show c72224a:configs/compute.yaml.
#
# None of it applies under SLURM: the scheduler owns allocation, cgroups enforce
# isolation, and CUDA_VISIBLE_DEVICES is set for us. src/obtune/sched/,
# src/obtune/gpu_alloc.py, scripts/launch_workers.sh and scripts/supervise.sh are
# superseded by sbatch wrappers.
legacy_scheduler_policy:
  retired: 2026-08-28
  superseded_by: slurm
