# RQ2' / E6 (2026-09-07) — per-mechanism specialist on X1s, the string-encoding-only half of X1 (no MBA arithmetic).
# MODEL-NEUTRAL, same shape as grid_py_X1.yaml so `tuned_X1s` is comparable to `tuned_X1`.
#
# WHY THIS EXISTS. X1→H1 transfer was lossless (0.08 pts), which says the FAMILY transfers.
# It does not say which mechanism carried it, or whether one mechanism's specialist helps on
# the other. X1 is split into its two mechanisms (configs/conditions.yaml::X1m / X1s, both
# built by obf/py/x1.py with `mechanisms` gated); training on one and evaluating on the other
# is the within-family transfer test that decides whether the unit of transfer is the family
# or the mechanism. No H1 is read anywhere in this arm (CLAUDE.md §3.2: budget spent).
_extends: _base_lora.yaml

language: python
train_conditions: [X1s]
run_tag: grid_py_X1s
phase: main

train:
  per_device_batch: 16
  grad_accum: 4
  # 2026-09-08: at 2048 the truncation gate refused this arm (job 382537): 1.64 %, 33 of 2,007
  # rows, max 4,612 tokens. String encoding lengthens every literal, and X1s concentrates the
  # rows X1 diluted (X1 parent: 0.69 %; X1m: 0.10 %). Raised rather than dropping programs so
  # the X1s program set stays the one X1m/X1 saw — dropping the long third would change WHICH
  # programs this arm learns, which is the confound the split is meant to avoid. Same lr,
  # batch shape and epochs as its siblings; only the window differs.
  max_seq_len: 4096
