# Overtraining probe: L1b (python) at 9 epochs instead of 3.
#
# Tests Horoi et al. (arXiv:2506.14126v2), "overtraining experts harms model merging", whose
# mechanism is memorization of hard examples dominating LATE fine-tuning. Measured 2026-08-10
# on the existing 3-epoch checkpoints, that mechanism is ABSENT here: across epochs 1->3 the
# mean pairwise cosine between experts is flat (0.584 -> 0.592) and coordinate sign-conflict
# FALLS (0.402 -> 0.391) while TIES retention rises (0.854 -> 0.861).
#
# The reason is visible in trainer_state.json: training loss is still falling steadily at
# epoch 2.5 (0.90 -> 0.31 over 219 steps). We are not in the overtraining regime at all, so
# the existing checkpoints cannot test the hypothesis - they can only show it does not apply
# to a model that is still learning. Extending to 9 epochs is what puts the regime in reach.
#
# Three conditions, not eight: one identifier (L1b), one structural (S1), one mixed (S2). If
# interference does not grow for these it will not grow for the rest, and this costs ~3 GPU-h
# instead of ~8.
_extends: _base_lora.yaml

model: qwen25c-1.5b
language: python
train_conditions: [L1b]
run_tag: overtrain_py_L1b
phase: main

# MUST NOT be runs/adapters: adapter_dir encodes (conditions, rank, seed) but NOT
# epochs, so this config would otherwise resolve to the SAME directory as the 3-epoch
# expert and overwrite the bank the entire RQ1 transfer matrix is built on.
adapter_root: runs/adapters_overtrain

train:
  epochs: 9
