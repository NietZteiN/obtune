# Paired consistency (objective O1) on codegemma-7b — panel core arm, 2026-09-10.
#   L = CE(y | x_obf) + lam * KL( p_teacher(. | x_L0parent) || p_student(. | x_obf) )  at answer tokens
# lam = 3 is the plateau established by the round-2 sweep on the trainable grid; the teacher is
# THIS model's own tuned_L0, per E4 (2026-09-08): the unseen-family number is distilled from the
# teacher, so a teacher from another model would import that model's behaviour, not this one's.
_extends: _base_lora.yaml

model: codegemma-7b
language: python
train_conditions: [L0, L1b, L1r, L2, S1, S2]
run_tag: obj_cons_py
phase: main
# obtune.objectives::out_dir_for appends the objective tag itself, giving
# `<conditions>_r32_cons_parent_lam3_s17` — the same convention as the CodeLlama arms. The
# scoped root added earlier today was working around the WRONG ENTRY POINT (train_sft, which
# ignores the objective block entirely and names by conditions alone); with the right one the
# suffix comes for free and no extra root is needed.
adapter_root: runs/adapters_objectives

objective:
  mode: consistency
  lam: 3.0
  teacher_view: parent
  teacher_adapter: runs/adapters/codegemma-7b/python/L0_r32_s17/best

train:
  # NOT from models.yaml here. models.yaml declares 16 x 4 for this model, which is right for
  # plain SFT and OOMs under the consistency objective: the KL term holds answer-token logits over
  # the FULL vocabulary for BOTH student and teacher, and the Gemma family's vocab is 256,000
  # against StarCoder2's and Granite's ~49,000 — five times the logit tensor for the same batch.
  # Measured: 16 x 4 died at step 17 trying to allocate 30.52 GiB on a 140 GB H200 (job 390240).
  # 4 x 16 keeps the effective batch at 64, so the arm stays comparable to every other one.
  per_device_batch: 4
  grad_accum: 16
  train_size: 30000
  seed: 17
