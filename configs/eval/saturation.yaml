# E12 / RQ1' support — data saturation of the two standing SFT arms, 7B. NO H1.
#
# WHY THIS EXISTS. "Breadth hurts on the unseen family" is a claim about WHAT was trained on,
# and it is only that if the arms are data-saturated: if tuned_L0 at half its 4,689 rows is
# already as good, the count of rows is not what separates it from mono_all's 26,841. The
# half/quarter arms are trained by train_sft --train-size (rows subsampled before splitting;
# same seed) into runs/adapters_saturation so the standing adapters are never touched.
# TOST margin ±1.0 pts pre-registered in CLAUDE_SCRATCHPAD.md 2026-09-07.
_extends: _base_eval.yaml

phase: saturation
experiment_id: saturation
run_tag: saturation
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: tuned_L0_half, adapter: "runs/adapters_saturation/{model}/{language}/L0_n2344_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: tuned_L0_quarter, adapter: "runs/adapters_saturation/{model}/{language}/L0_n1172_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: mono_half, adapter: "runs/adapters_saturation/{model}/{language}/mono_n13420_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: mono_quarter, adapter: "runs/adapters_saturation/{model}/{language}/mono_n6710_r32_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1]
