# LOTO — the six leave-one-transform-out folds, each evaluated on EVERY condition.
# MODEL-NEUTRAL.
#
# The DIAGONAL is the result: fold `loto_holdX` scored on `X` is an adapter meeting a
# transform it never saw. The off-diagonal is the in-mixture reference saying how much of
# the diagonal gap is "unseen transform" rather than "this condition is just harder", and
# `mono_all` (which saw all six) is the ceiling the diagonal is priced against.
#
# H1 IS DELIBERATELY ABSENT and must not be "fixed" later: the entire point of this arm is
# an OOD signal that costs no quarantine budget. Adding H1 here would spend an access on
# every sweep iteration and recreate the problem the arm exists to solve.
_extends: _base_eval.yaml

phase: loto_generic
experiment_id: loto_generic
run_tag: loto_generic
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

systems:
  - {name: base, arch: none}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: loto_holdL0, adapter: "runs/adapters_loto/{model}/{language}/L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: loto_holdL1b, adapter: "runs/adapters_loto/{model}/{language}/L0-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: loto_holdL1r, adapter: "runs/adapters_loto/{model}/{language}/L0-L1b-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: loto_holdL2, adapter: "runs/adapters_loto/{model}/{language}/L0-L1b-L1r-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: loto_holdS1, adapter: "runs/adapters_loto/{model}/{language}/L0-L1b-L1r-L2-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: loto_holdS2, adapter: "runs/adapters_loto/{model}/{language}/L0-L1b-L1r-L2-S1_r32_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
