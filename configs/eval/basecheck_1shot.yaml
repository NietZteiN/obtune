# One-shot variant of the panel gate (2026-09-10).
#
# WHY IT EXISTS. The zero-shot gate cannot measure a PRETRAINED checkpoint, and the reason is
# structural rather than a bug. `llama31-8b-base` answers by opening a new block: it emits a
# blank line and then the value ("\n[3, 11, 15, 20, 23]\n" is a correct answer from this model).
# The eval's stop sequence is "\n\n" (`_base_eval.yaml`), shared by every model so that cells are
# comparable, so the blank-line opening truncates the answer before it starts -- 90 % of items
# return "\n" at 2-3 generated tokens. Removing the trailing newline after the response header
# changed the failures from empty strings to a bare "\n" and moved the accuracy not at all
# (0.0383 both times, jobs 388497 and 388553).
#
# A one-shot demonstration is the project's existing answer to "this model does not know what
# shape the answer takes" -- the same machinery the ICL arms use -- and it is what a base model
# is normally evaluated with.
#
# NOT COMPARABLE TO THE ZERO-SHOT CELLS. Every other panel model was gated zero-shot. A number
# from here may be compared to another number from here (hence the incumbent reference below)
# and never to a `basecheck_panel` cell. That is why this is a separate phase and a separate
# config rather than a flag on the other one.
_extends: _base_eval.yaml

phase: basecheck_1shot
experiment_id: basecheck_1shot
run_tag: basecheck_1shot
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

systems:
  - {name: base_1shot, arch: none, one_shot: true}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
