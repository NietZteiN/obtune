# GO/NO-GO for Llama-3.1-8B-Instruct as a third base (W6 lever 1, 2026-09-04).
#
# WHY. Within CodeLlama-7B every tuning lever is null (rank, merges, routing, breadth,
# alignment; MASTER_REPORT 19-26), and the strongest number in the corpus is an UNTUNED
# newer model: Qwen2.5-Coder-7B + 4-shot ICL reads L0 0.487 / H1 0.291, above every tuned
# CodeLlama-7B system and above 13B mono_all on L0. Qwen/DeepSeek are barred on juno, so
# the newest ungated instruct model already on disk is the candidate.
#
# WHAT DECIDES IT. The CodeLlama gate read L0 0.257 / format_fail 0.129 and passed. This
# one is a GO if the untuned base is at or above tuned CodeLlama-7B (L0 ~0.43) OR clears
# CodeLlama base by a wide margin with format_fail well under 0.13 -- the format floor must
# not be the thing the adapters learn. All six trainable conditions, since the run is
# minutes. NO H1 -- a go/no-go never touches it.
_extends: _base_eval.yaml

phase: basecheck
experiment_id: basecheck_llama31_8b
run_tag: basecheck_llama31_8b
model: llama31-8b
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

systems:
  - {name: base, arch: none}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
