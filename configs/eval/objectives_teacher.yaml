# RQ3' / E4 — teacher ablation of the consistency objective, 7B. NO H1.
# cons_lam3 (tuned_L0 teacher, standing arm; its cells already exist under objectives_generic)
# vs cons_tbase (untuned teacher) vs cons_tmono (mono_all teacher). tuned_L0 and mono_all are
# re-evaluated here so every contrast in the analysis is same-phase, same-day, same-engine.
_extends: _base_eval.yaml

phase: objectives_teacher
experiment_id: objectives_teacher
run_tag: objectives_teacher
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: cons_lam3, adapter: "runs/adapters_objectives/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_cons_parent_lam3_s17/best", arch: per_type, train_cond: mix}
  - {name: cons_tbase, adapter: "runs/adapters_objectives/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_cons_tbase_lam3_s17/best", arch: per_type, train_cond: mix}
  - {name: cons_tmono, adapter: "runs/adapters_objectives/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_cons_tmono_lam3_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1]
