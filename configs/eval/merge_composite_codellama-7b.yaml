# C4 / F1 — MERGING and the SPECIALISTS on stacked inputs, CodeLlama-7b (2026-09-12).
#
# The merging half of F1, plus the three specialists F3's order test needs. Merging was measured on
# single transforms only (-3.13 against the specialists' +2.47); on stacks it has never been read on
# this panel. `l0merge_*` anchors the merge on the clean-code adapter and is the "is it the merge or
# the specialists" control, exactly as on singles.
#
# `tuned_S2` already has composite cells from the depth-2 and depth-3 runs; `tuned_L1r`, `tuned_S1`
# and `tuned_L1b` do not, and they are what turns F3's order pair (C_L1r_S1 vs C_S1_L1r) into a test
# of whether stacking DESTROYS a structural specialist's surface cue.
#
# A MERGE HAS NO `best/` SUBDIRECTORY -- it has no training run and therefore no checkpoints, and
# the weights sit at the directory itself. Pointing at `best/` resolves to nothing; until the guard
# added 2026-09-11 that silently evaluated the BASE model under the merge's name.
_extends: _base_eval.yaml

phase: composite_generic
experiment_id: rq1_merge_composite
run_tag: merge_composite_codellama-7b
model: codellama-7b
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: merge_ties, adapter: "runs/adapters/codellama-7b/python/merge_ties_r32_s17", arch: per_type, train_cond: merge}
  - {name: merge_dare_ties, adapter: "runs/adapters/codellama-7b/python/merge_dare_ties_r32_s17", arch: per_type, train_cond: merge}
  - {name: merge_dare_linear, adapter: "runs/adapters/codellama-7b/python/merge_dare_linear_r32_s17", arch: per_type, train_cond: merge}
  - {name: l0merge_ties, adapter: "runs/adapters/codellama-7b/python/l0merge_ties_r32_s17", arch: per_type, train_cond: L0}
  - {name: l0merge_dare_ties, adapter: "runs/adapters/codellama-7b/python/l0merge_dare_ties_r32_s17", arch: per_type, train_cond: L0}
  - {name: tuned_L1r, adapter: "runs/adapters/codellama-7b/python/L1r_r32_s17/best", arch: per_type, train_cond: L1r}
  - {name: tuned_S1, adapter: "runs/adapters/codellama-7b/python/S1_r32_s17/best", arch: per_type, train_cond: S1}
  - {name: tuned_L1b, adapter: "runs/adapters/codellama-7b/python/L1b_r32_s17/best", arch: per_type, train_cond: L1b}

eval_conditions: [C_L1b_S1, C_L1r_S1, C_S1_L1r, C_L2_S4, C_L1r_S3, C_S4_S3,
                  C3_L1r_S3_S4, C3_S1_S3_S4, C3_L1r_S1_S4, C4_L1r_S1_S3_S4]
