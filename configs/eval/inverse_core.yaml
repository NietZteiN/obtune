# F7 — the REVERSE task at 13B and 34B, on the four arms every scale has (2026-09-12).
#
# WHY A SECOND CONFIG. `inverse_generic.yaml` carries six per-condition specialists and
# `formatonly`, which exist for CodeLlama-7b and for neither larger scale. Pointing it at 13B would
# fail on a missing adapter -- or, before the guard added 2026-09-11, would have silently evaluated
# the BASE model under those arms' names.
#
# WHAT IT SETTLES. RQ5'/RQ4's reverse-task leg is 7B only, where the honest result is "undamaged"
# (`cons_lam3 - base` +0.49 [-1.38, +2.30]), not "consistent". Two more scales make that a statement
# about the objective rather than about one model. Rules (F7 in docs/PAPER_EXPERIMENTS.md §7):
#   H-F7-no-harm  -- `cons_lam3 - base` @ the six seen conditions, ci_hi >= 0 at BOTH scales.
#   H-F7-vs-sft   -- `cons_lam3 - tuned_L0` @ the obfuscated conditions, ci_lo > 0 at BOTH.
# `tuned_X1` is carried because it was the only arm to beat base backwards at 7B, on its own family.
_extends: _base_eval.yaml

phase: inverse_generic
experiment_id: inverse_core
run_tag: inverse_core
language: python
eval_source: heldout
# `input`, NOT `inverse`. The task key names the PREDICTION DIRECTION and takes output|input;
# "inverse" is the name of the experiment, not a value the runner accepts. Writing the experiment's
# name here cost one job, which failed in 3 s with a clear message -- the fast-fail path doing
# exactly its job, since the alternative is discovering it after an engine has loaded.
task: input

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: base, arch: none}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: cons_lam3, adapter: "runs/adapters_objectives/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_cons_parent_lam3_s17/best", arch: per_type, train_cond: mix}
  - {name: tuned_X1, adapter: "runs/adapters/{model}/{language}/X1_r32_s17/best", arch: per_type, train_cond: X1}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1]
