# W5: hidden-state alignment arms on the trainable grid, CodeLlama-7b (2026-09-04).
# Trained by configs/train/align_codellama7b_py_mono.yaml. Cells land in rq2_generic so each
# arm sits beside `tuned_L0` (the teacher and the control) and the `mono_all` seed band
# (s17/s42/s101) it is read against. No H1; `final_eval` stays unspent.
#
# align_lam0 is the plumbing gate: same data, same knobs, lambda = 0 -- it must reproduce
# mono_all inside the seed band or nothing else on this file means anything. The mismatched
# twin (`invariance_mismatch`) is the control that decides whether a matched gain is semantic
# (matched > mismatched) or just regularization (matched == mismatched).
_extends: _base_eval.yaml

phase: rq2_generic
experiment_id: rq2_generic
run_tag: rq2_generic_align
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: align_lam0, adapter: "runs/adapters_align/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_lam0_k4_L4-10-16-21-25-30_s17/best", arch: invariance, train_cond: mix}
  - {name: align_lam1, adapter: "runs/adapters_align/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_lam1_k4_L4-10-16-21-25-30_s17/best", arch: invariance, train_cond: mix}
  - {name: align_lam1_mm, adapter: "runs/adapters_align/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_lam1_k4_L4-10-16-21-25-30_mismatch_s17/best", arch: invariance_mismatch, train_cond: mix}
  - {name: align_lam3, adapter: "runs/adapters_align/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_lam3_k4_L4-10-16-21-25-30_s17/best", arch: invariance, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
