# E1 (docs/PAPER_EXPERIMENTS.md) — the X1 column at 13B and 34B. MODEL-NEUTRAL. NO H1.
#
# WHY THIS EXISTS. The paper's central claim (C1: breadth training hurts on an unseen
# obfuscator) is established on H1, and the H1 budget is FULLY SPENT — CLAUDE.md §3.2 rule 3
# permits no further read, so the claim can never gain another H1 replicate. X1 is the
# trainable sibling that reproduces H1's level at r = 0.9992 (mean |Δ| 0.48 pts over six arms
# trained on neither), so it is the only held-out column this project can still read.
#
# Both adapters already exist at both scales (trained for the 09-05 scale batch); this is an
# EVAL-ONLY job. `X1` alone is evaluated because L0–S2 already exist for these two systems at
# both scales under `rq2_generic`, and re-reading them at 34B would cost more than the question.
_extends: _base_eval.yaml

phase: x1_generic
experiment_id: x1_scale
run_tag: x1_scale
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [X1]
