# Evaluation defaults (vLLM offline batched greedy).

engine:
  backend: vllm
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  max_lora_rank: 64
  max_loras: 4
  max_cpu_loras: 32
  seed: 17
  # Larger than the 1536 training window: a one-shot oracle demo in front of
  # flattened S1/S2 code exceeds it, and truncation would silently damage the
  # structural conditions rather than failing loudly.
  # p99 of held-out prompts is ~1.5k tokens; 8192 leaves headroom for a one-shot
  # oracle demo in front of flattened S1 code. Genuinely pathological items are
  # dropped and recorded by drop_overlong() rather than raising and killing the cell.
  max_model_len: 8192

sampling:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 64
  # `<end_of_turn>` added 2026-09-10. CodeGemma-7B's generation_config lists eos_token_id=1
  # (`<eos>`) ONLY, while its chat template terminates an assistant turn with `<end_of_turn>`
  # (id 107) -- so a model FINE-TUNED on that template emits the terminator and vLLM does not
  # stop, running to max_tokens and repeating the answer:
  #   '1<end_of_turn>\n<end_of_turn>\n1<end_of_turn>\n...'  -> format_fail 1.000 on every item.
  # Gemma-3 is unaffected because its generation_config lists [1, 106], which includes its own
  # terminator; that is why the Gemma-3 probe worked and the CodeGemma one read 0.0000.
  # Adding it as a STOP STRING is a no-op for every model that never emits that text, so no
  # published cell changes; it only rescues the models whose eos config omits their terminator.
  stop: ["\n\n", "```", "<end_of_turn>"]

prompt:
  id: base_v1
  oracle: false

scoring:
  # Strict normalized exact match. NO containment stage — the LOG.md 2026-06-09 audit
  # showed it produces ~3% false positives ('927' matching inside '9273').
  float_tol: 1.0e-6
  case_sensitive_strings: true

output:
  cell_dir: results/cells
  resume: true # a cell whose parquet exists is skipped
