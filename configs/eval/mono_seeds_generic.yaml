# Seed band for the monolithic adapter. MODEL-NEUTRAL.
#
# `rq2_generic` reads `mono_all` at seed 17 only, and the artifact reports the `mono_all` vs
# `tuned_L0` tie from one seed. Seeds 42 and 101 were trained 2026-09-03 (ck_mono_s42 best
# 0.3495); these cells land in the SAME phase directory as rq2_generic so the seed band sits
# beside the s17 cell it widens. No H1.
_extends: _base_eval.yaml

phase: rq2_generic
experiment_id: rq2_generic
run_tag: rq2_generic_mono_seeds
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: mono_all_s42, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s42/best", arch: per_type, train_cond: mix}
  - {name: mono_all_s101, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s101/best", arch: per_type, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
