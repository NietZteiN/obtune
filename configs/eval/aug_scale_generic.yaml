# Transform-diversity and data-scale arms on the trainable grid. MODEL-NEUTRAL.
#
# Cells land in the SAME phase directory as rq2_generic so each arm sits beside the
# `tuned_L0` control and the `mono_all` s17/s42/s101 band it is read against. Every arm
# lives under its own adapter_root (see the train configs) because the adapter directory
# name encodes only (conditions, rank, seed). No H1: this is selection-side reading and
# `final_eval` stays unspent. Use --systems to run whichever arms have finished training.
_extends: _base_eval.yaml

phase: rq2_generic
experiment_id: rq2_generic
run_tag: rq2_generic_aug_scale
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: mono_aug, adapter: "runs/adapters_aug/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: mono_scale, adapter: "runs/adapters_scale/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: tuned_L0_scale, adapter: "runs/adapters_scale/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
