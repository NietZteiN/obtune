# THE IN-CONTEXT BASELINE ON EVERY CONDITION (2026-09-13). basecheck_1shot.yaml covers the six
# ladder conditions only; the master table's ICL column is therefore empty on X1 and on every stack.
# Same phase, so existing cells are resumed past.
#
# THE FORMAT GATE IS EXPECTED TO BITE HERE. The one-shot template was written and validated on
# CodeLlama-7B; on several panel models it pushes the model out of the answer format (2026-09-13,
# log/transfer/2026-09-13_backward-task-format-collapse-on-the-panel.md). Cells over the 0.25 gate
# are marked in the tables rather than read, which is the point of running them.
_extends: _base_eval.yaml

phase: basecheck_1shot
experiment_id: basecheck_1shot_panel
run_tag: basecheck_1shot_panel
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

systems:
  - {name: base_1shot, arch: none, one_shot: true}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1,
                  C_L1b_S1, C_L1r_S1, C_S1_L1r, C_L2_S4, C_L1r_S3, C_S4_S3,
                  C3_L1r_S3_S4, C3_S1_S3_S4, C3_L1r_S1_S4, C4_L1r_S1_S3_S4,
                  C_L1r_X1, C_X1_S1, C_S2_X1, C3_L1r_S1_X1, C_L1r_X1m, C_S1_X1s]
