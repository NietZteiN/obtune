# THE LADDER, BACKWARDS, WITH THE SAME PROMPT AS EVERYTHING ELSE (2026-09-14).
#
# THE BUG THIS REPAIRS. `inverse_core.yaml` wrote the backward LADDER cells for the seven non-7B
# models with NO `one_shot`, so they carry `prompt_id: inverse_v1`. Every backward STACK cell
# (inverse_stacks.yaml), every backward MERGE cell (inverse_merge.yaml) and every CodeLlama-7B
# backward cell carries `inverse_1shot_v1`. Two different prompts sat in one phase, in one column of
# the master table, and the difference is not small: CodeGemma's `mono_all` has a format-failure
# rate of 0.882 on L1b under the zero-shot prompt and 0.086 on C_L1b_S1 under the one-shot one, with
# accuracy 0.049 against 0.276.
#
# WHAT THAT MEANS FOR WHAT HAS BEEN CLAIMED. "The backward template was written for CodeLlama-7B and
# fails the gate on most cells of the other panel models" described the ZERO-SHOT template, which
# those models are the only ones that ever got. And `62_merge_backward.py` compares the merges
# (one-shot) against base/tuned_L0/mono_all/cons_lam3/tuned_X1 (zero-shot) on the ladder, so its
# format-gate exclusions and its merge advantage are partly a prompt difference. The stack-based
# reads (65_backward_stacks.py, 66_three_methods.py) are NOT affected: every arm there is one-shot.
#
# WHY A NEW PHASE. The old cells are not wrong, they are a different prompt, and `run_cell` resumes
# on (phase, system, condition) -- pointing this at `inverse_generic` would silently skip every cell
# it is meant to replace. `inverse_1shot` keeps both readings on disk; the readers prefer this phase
# and fall back to `inverse_generic`, which leaves 7B (already one-shot) and the stacks untouched.
_extends: _base_eval.yaml

phase: inverse_1shot
experiment_id: inverse_ladder_1shot
run_tag: inverse_ladder_1shot
language: python
eval_source: heldout
task: input

engine:
  gpu_memory_utilization: 0.85

sampling:
  max_tokens: 128

scoring:
  float_tol: 1.0e-6
  exec: {timeout_s: 2.0, mem_mb: 512, workers: 16}

peft:
  r: 32

# Exactly inverse_core.yaml's five arms -- the ones that were written zero-shot -- with one_shot
# added. The merges are NOT re-run: their ladder cells are already one-shot and correct.
systems:
  - {name: base, arch: none, one_shot: true}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0, one_shot: true}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix, one_shot: true}
  - {name: cons_lam3, adapter: "runs/adapters_objectives/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_cons_parent_lam3_s17/best", arch: per_type, train_cond: mix, one_shot: true}
  - {name: tuned_X1, adapter: "runs/adapters/{model}/{language}/X1_r32_s17/best", arch: per_type, train_cond: X1, one_shot: true}
# THE MERGES, ADDED 2026-09-14 (second pass). `inverse_merge.yaml` covered the backward LADDER on
# only four of the eight models -- CodeLlama-7B, Llama-3.1-8B, StarCoder2 and Granite -- so
# 62_merge_backward.py cannot run at all on CodeLlama-13B, CodeLlama-34B, Gemma-3 or CodeGemma, and
# the merge is now the arm the paper's argument rests on. They were always one-shot, so adding them
# here changes nothing about how they are asked; it just puts the whole one-shot ladder in one phase.
# Resume skips the five arms above on models where this config has already run.
  - {name: merge_dare_ties, adapter: "runs/adapters/{model}/{language}/merge_dare_ties_r32_s17", arch: per_type, train_cond: merge, one_shot: true}
  - {name: merge_ties, adapter: "runs/adapters/{model}/{language}/merge_ties_r32_s17", arch: per_type, train_cond: merge, one_shot: true}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1]
