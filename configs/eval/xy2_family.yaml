# E5 / H-family-generalises — the second family pair. MODEL-NEUTRAL. NO H1.
#
# Y2 is the unseen sibling: no system here was trained on it. `tuned_X2` saw the FAMILY
# (exception routing) with a different surface; `tuned_X1` saw a DIFFERENT family entirely
# (encoding) and is the cross-family control that says whether any held-out-family exposure
# helps or only the matching one; `tuned_L0` and `mono_all` are the standing controls the
# whole report reads against.
_extends: _base_eval.yaml

phase: xy2_generic
experiment_id: xy2_family
run_tag: xy2_family
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: base, arch: none}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: tuned_X2, adapter: "runs/adapters/{model}/{language}/X2_r32_s17/best", arch: per_type, train_cond: X2}
  - {name: tuned_X1, adapter: "runs/adapters/{model}/{language}/X1_r32_s17/best", arch: per_type, train_cond: X1}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [L0, X2, Y2]
