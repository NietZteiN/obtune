# THE BACKWARD TASK ON THE PILOT MODEL (2026-09-14, user: "I still want to see backward").
#
# WHY IT DID NOT EXIST. The inverse task (RQ5', src/obtune/inverse.py) was designed after the Qwen
# pilot, so qwen25c-1.5b has 2,008 forward cells and ZERO with task=input -- its master table could
# only ever be half a table. This fills the other half with the same arms, the same one-shot inverse
# prompt and the same execution grading every panel model is read under, so the two halves are
# comparable and Table 5/6's forward-backward pattern holds for the pilot too.
#
# NO `tuned_X1`, NO `cons_lam3`, NO `base_1shot`: those arms were never built for this model, which
# is why they are `--` in its forward table. `mole_router` needs the gate at
# runs/mole/qwen25c-1.5b/python/routerlora_v1_s17/gate.pt and runs through mole/eval_mole.py, not
# this config -- queued separately.
#
# H1 IS ABSENT from eval_conditions and eval_vllm refuses it for task='input' anyway (quarantine
# budget spent, CLAUDE.md 3.2). S3/S4 are included: this model has them as standalone transforms.
_extends: _base_eval.yaml

phase: inverse_generic
experiment_id: inverse_qwen25c-1.5b
run_tag: inverse_qwen25c-1.5b
model: qwen25c-1.5b
language: python
eval_source: heldout
task: input

engine:
  gpu_memory_utilization: 0.85

sampling:
  max_tokens: 128
  # The newline stop the backward configs should always have carried; see
  # log/transfer/2026-09-14_input-prediction-examined-and-fixed.md. This config is new, so its cells
  # need no v2 re-grade.
  stop: ["\n", "\n\n", "```", "<end_of_turn>"]

scoring:
  float_tol: 1.0e-6
  exec: {timeout_s: 2.0, mem_mb: 512, workers: 16}

systems:
  - {name: base, arch: none, one_shot: true}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0, one_shot: true}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix, one_shot: true}
  - {name: merge_dare_ties, adapter: "runs/adapters/{model}/{language}/merge_dare_ties_r32_s17", arch: per_type, train_cond: merge, one_shot: true}
  - {name: merge_ties, adapter: "runs/adapters/{model}/{language}/merge_ties_r32_s17", arch: per_type, train_cond: merge, one_shot: true}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, S3, S4,
                  C_L1b_S1, C_L1r_S1, C_S1_L1r, C_L2_S4, C_L1r_S3, C_S4_S3]
