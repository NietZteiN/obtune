# H1 FINAL READ, panel 2 of 2 (CodeLlama-7B, the X1-family arms). QUARANTINE ACCESS — LAST ONE.
#
# AUTHORISED BY THE USER 2026-09-05 as part of the same five-arm manifest as
# `h1_final_codellama34b.yaml`; see that file's header for the two-panels-one-read reasoning.
# The pilot is spent; this is the final pass; there is no third read.
#
# THE HYPOTHESES ARE FIXED BEFORE ANY H1 NUMBER IS SEEN. From
# log/transfer/2026-09-05_x1-is-a-trainable-proxy-for-h1.md:
#
#   * H-X1-family, SECOND CONJUNCT (the first passed on the X1 column: `tuned_X1 − tuned_L0`
#     +4.86 [+2.80, +6.92], `− tuned_S2` +3.29 [+1.23, +5.52]). CONFIRM if `tuned_X1` on H1
#     exceeds the spent pilot's leader `tuned_S2` (0.2834) outside its interval; REFUTE if it
#     lands inside the specialists' band (0.252–0.283). This is the paper's discriminating
#     test: X1 was built as H1's TRAINABLE sibling — different MBA identities, different
#     string-encoding key, none of `h1_marker_patterns` — so if training on the family
#     transfers, H1's difficulty is its mechanism family and not its surface.
#   * H-mono-X on H1: `mono_allX − mono_all`. On X1 it is +7.74 [+5.45, +10.21]; `mono_all`
#     on H1 is 0.2323 from the pilot.
#
#   WHY THE X1 DIAGONAL CANNOT SUBSTITUTE FOR THIS READ, stated before it happens: X1 tracks
#   H1 at r = 0.9992 (mean |Δ| 0.48 pts) — but ONLY on arms trained on neither column. Both
#   arms here are trained on X1, so their X1 numbers are diagonal, carry no information about
#   H1, and the correspondence explicitly does not extend to them. If it did there would be
#   no experiment. The transfer arms in panel 1 and the pilot are what the r = 0.999 covers.
#
# H1 IS NEVER TRAINED ON — these adapters saw X1, which is generated by a separate module
# under data/train/, and the four quarantine layers pass on that corpus. Grid A.
_extends: _base_eval.yaml

phase: h1_codellama
experiment_id: h1_final_x1_codellama7b
run_tag: h1_final_x1_codellama7b
model: codellama-7b
language: python
eval_source: heldout
h1_access_purpose: final_eval

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: tuned_X1, adapter: "runs/adapters/codellama-7b/python/X1_r32_s17/best", arch: per_type, train_cond: X1}
  - {name: mono_allX, adapter: "runs/adapters/codellama-7b/python/L0-L1b-L1r-L2-S1-S2-X1_r32_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [H1]
