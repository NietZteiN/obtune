# MERGING ON THE PANEL (2026-09-13). The three weight-space merges built by
# scripts/merge/build_ready_merges.py (TIES, DARE-TIES, DARE-linear over the L0 + five specialists),
# plus the five specialists themselves, on the ladder, the unseen family, the six depth-2 seen
# stacks, and the four X1-containing stacks -- for every panel model whose specialists exist.
# Model-neutral: `{model}` is filled from --model (eval_vllm resolves it). Merges are plain
# adapters, so this runs through vLLM; the untuned `base` is re-evaluated in this phase so every
# delta is paired on the same items and engine. Rule pre-registered in CLAUDE_SCRATCHPAD.md
# (H-merge-panel) before the first submission; 0 merge cells existed on any of these models.
_extends: _base_eval.yaml

phase: merge_panel
experiment_id: merge_panel
run_tag: merge_panel
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: base, arch: none}
  - {name: merge_ties, adapter: "runs/adapters/{model}/{language}/merge_ties_r32_s17", arch: per_type, train_cond: merge}
  - {name: merge_dare_ties, adapter: "runs/adapters/{model}/{language}/merge_dare_ties_r32_s17", arch: per_type, train_cond: merge}
  - {name: merge_dare_linear, adapter: "runs/adapters/{model}/{language}/merge_dare_linear_r32_s17", arch: per_type, train_cond: merge}
  - {name: tuned_L1b, adapter: "runs/adapters/{model}/{language}/L1b_r32_s17/best", arch: per_type, train_cond: L1b}
  - {name: tuned_L1r, adapter: "runs/adapters/{model}/{language}/L1r_r32_s17/best", arch: per_type, train_cond: L1r}
  - {name: tuned_L2, adapter: "runs/adapters/{model}/{language}/L2_r32_s17/best", arch: per_type, train_cond: L2}
  - {name: tuned_S1, adapter: "runs/adapters/{model}/{language}/S1_r32_s17/best", arch: per_type, train_cond: S1}
  - {name: tuned_S2, adapter: "runs/adapters/{model}/{language}/S2_r32_s17/best", arch: per_type, train_cond: S2}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1,
                  C_L1b_S1, C_L1r_S1, C_S1_L1r, C_L2_S4, C_L1r_S3, C_S4_S3,
                  C_L1r_X1, C_X1_S1, C_S2_X1, C3_L1r_S1_X1]
