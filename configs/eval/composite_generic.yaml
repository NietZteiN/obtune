# RQ-A / RQ-B (docs/RQ_SUMMARY.md §5) — the COMPOSITE (stacked) ladder on the CodeLlama panel.
#
# WHY THIS EXISTS. §4 of RQ_SUMMARY reports a dissociation that is the strongest new result in the
# project and rests ENTIRELY on the frozen Qwen-1.5B panel: `mono_all − tuned_L0` is +3.91
# [+2.45, +5.28] pooled on stacked-but-SEEN transforms, while the same contrast is −4.12 on the
# UNSEEN H1. Breadth buys robustness to recombination and pays for it with robustness to novelty.
# Composites were never re-run after the model changed, so one panel carries the whole claim.
#
# `cons_lam3` is here for RQ-B: it already keeps breadth's trained-condition gain without breadth's
# held-out tax (§27.5/§27.7). If it ALSO keeps breadth's stacking robustness it dominates
# `mono_all` outright rather than being one arm among many.
#
# The composite items are model-independent (data/eval/heldout/items/C_*), so this is eval-only.
# Composites live in their own namespace (configs/conditions_composite.yaml) and are NEVER part of
# the RQ1 transfer matrix -- CLAUDE.md §3.1: the ladder is single-transform by design.
_extends: _base_eval.yaml

phase: composite_generic
experiment_id: composite_generic
run_tag: composite_generic
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: base, arch: none}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: cons_lam3, adapter: "runs/adapters_objectives/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_cons_parent_lam3_s17/best", arch: per_type, train_cond: mix}
  - {name: tuned_S2, adapter: "runs/adapters/{model}/{language}/S2_r32_s17/best", arch: per_type, train_cond: S2}

eval_conditions: [C_L1b_S1, C_L1r_S1, C_S1_L1r, C_L2_S4, C_L1r_S3, C_S4_S3]
