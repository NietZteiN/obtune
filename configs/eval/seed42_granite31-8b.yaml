# GRANITE SEED-42 (2026-09-17). Cloned from the Llama config with two arms removed: tuned_X1_s42 and
# cons_lam3_s42 were never trained for Granite at seed 42 -- the second seed here exists to test the
# ONE panel exception (DARE-TIES null backward on Granite), which needs base, breadth and the merges.
# Listing an arm whose adapter does not exist is how four evals died this week; preflight_eval.py
# checks this file before submission.
# SECOND SEED, FORWARD, Llama-3.1-8B (2026-09-14). Same phase as the 7B pair so one reader covers both models. Every headline number the paper quotes is s17-only,
# and CLAUDE.md section 4 says to vary seeds before claiming an effect. This evaluates the _s42
# replicates of the paper's arms on all 23 conditions in ONE phase, so 73_seed42.py can pair each
# s42 cell with its s17 twin (which lives in panel_core / composite_* / f2_divergence) and report the
# seed band on every contrast the paper makes. `base` is re-run here rather than resumed so the
# comparison is engine-identical within the phase.
# tuned_X1_s42, merge_*_s42 are being built (h100 backfill manifests tr_*_granite31-8b_s42; merges after the specialists land); the missing-adapter guard
# refuses this config until they exist, which is the intended gate.
_extends: _base_eval.yaml

phase: seed42_generic
experiment_id: seed42_granite31-8b
run_tag: seed42_granite31-8b
model: granite31-8b
language: python
eval_source: heldout

systems:
  - {name: base, arch: none}
  - {name: tuned_L0_s42, adapter: "runs/adapters/{model}/{language}/L0_r32_s42/best", arch: per_type, train_cond: L0}
  - {name: mono_all_s42, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s42/best", arch: per_type, train_cond: mix}
  - {name: merge_ties_s42, adapter: "runs/adapters/{model}/{language}/merge_ties_r32_s42", arch: per_type, train_cond: merge}
  - {name: merge_dare_ties_s42, adapter: "runs/adapters/{model}/{language}/merge_dare_ties_r32_s42", arch: per_type, train_cond: merge}

eval_conditions: [L0, L1b, L1r, L2, S1, S2, X1,
                  C_L1b_S1, C_L1r_S1, C_S1_L1r, C_L2_S4, C_L1r_S3, C_S4_S3,
                  C3_L1r_S3_S4, C3_S1_S3_S4, C3_L1r_S1_S4, C4_L1r_S1_S3_S4,
                  C_L1r_X1, C_X1_S1, C_S2_X1, C3_L1r_S1_X1, C_L1r_X1m, C_S1_X1s]
