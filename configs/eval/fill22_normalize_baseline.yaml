# §2.2 FILL — the same systems as `normalize_baseline_qwen1.5b.yaml`, on the conditions it never evaluated.
#
# WHY A SEPARATE FILE RATHER THAN EDITING THE ORIGINAL
# ---------------------------------------------------
# `normalize_baseline_qwen1.5b.yaml` produced numbers that are already in the master report. Editing its
# `eval_conditions` would change the provenance of results that are cited, so this extends it
# instead: identical systems, identical adapters, identical prompt, identical `eval_source`,
# and ONLY the condition list differs. Cells that already exist are resumed and skipped; only
# the blanks are generated.
#
# NO `H1`. Every condition below is trainable or a composite. `H1` blanks in §2.2 are left
# empty on purpose — they would cost ~40 s of GPU and the entire quarantine budget
# (CLAUDE.md §3.2 rule 3), which is not a trade worth making to square off a table.
#
# The composite conditions here were soundness-gated on 2026-08-15 before this file was
# written: 2,355 items x 4 profiles, 0 unsound. The normalization arm scores a REWRITTEN
# program against the ORIGINAL's output, and the gate had only ever covered the
# single-transform ladder — a rewrite that preserves behaviour on `S1` is not thereby
# safe on `C_L1r_S1`.

_extends: normalize_baseline_qwen1.5b.yaml

experiment_id: fill22_normalize_baseline
run_tag: fill22_normalize_baseline

eval_conditions: [C_L1r_S1, C_S1_L1r, C_L1b_S1, C_L2_S4, C_L1r_S3, C_S4_S3]
