# Lever 5 eval — the +3-case arms on the trainable grid, same phase/cells as the RQ2 ladder so
# they rank against `tuned_L0` / `mono_all` item-for-item. MODEL-NEUTRAL. NO H1.
_extends: _base_eval.yaml

phase: rq2_generic
experiment_id: rq2_generic
run_tag: rq2_generic_cases
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: tuned_L0_cases, adapter: "runs/adapters_cases/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_cases, adapter: "runs/adapters_cases/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
