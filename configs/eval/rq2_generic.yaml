# RQ2 modularity ladder — monolithic vs merged task vectors, and the control that decides
# whether merging's advantage is about the task vectors at all. MODEL-NEUTRAL.
#
# THE CONTROL IS THE POINT. `l0merge_*` merges N CLEAN-CODE adapters (different seeds, same
# condition) with the same algorithm, density, rank and weighting as the real merges. At
# Qwen-1.5B it reached 0.339 on H1 against the six specialists' 0.348 -- a 0.9-point gap,
# meaning the obfuscation expertise contributed almost nothing and DARE's stochastic
# drop-and-rescale was doing the work. Any merge result reported without this control beside
# it is not interpretable.
#
# `formatonly` is here for the same reason it is in the RQ1 grid: every gain must be read
# against the format floor, not against `base`.
#
# NO H1 -- the ladder is established on the trainable grid; the confirmatory read is separate.
_extends: _base_eval.yaml

phase: rq2_generic
experiment_id: rq2_generic
run_tag: rq2_generic
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: base, arch: none}
  - {name: formatonly, adapter: "runs/adapters_formatonly/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: tuned_L0, adapter: "runs/adapters/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: mono_all, adapter: "runs/adapters/{model}/{language}/L0-L1b-L1r-L2-S1-S2_r32_s17/best", arch: per_type, train_cond: mix}
  - {name: merge_ties, arch: merge_ties}
  - {name: merge_dare_ties, arch: merge_dare_ties}
  - {name: merge_dare_linear, arch: merge_dare_linear}
  - {name: l0merge_ties, adapter: "runs/adapters/{model}/{language}/l0merge_ties_r32_s17", arch: per_type, train_cond: L0}
  - {name: l0merge_dare_ties, adapter: "runs/adapters/{model}/{language}/l0merge_dare_ties_r32_s17", arch: per_type, train_cond: L0}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
