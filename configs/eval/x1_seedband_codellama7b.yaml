# E2 (docs/PAPER_EXPERIMENTS.md) — a seed band for the headline contrast on a held-out column.
#
# WHY THIS EXISTS. `mono_all` was read on X1 at s17/s42/s101 during objectives round 2, but
# `tuned_L0` has only s17 there, so `tuned_L0 − mono_all` — the paper's C1 — has no seed band on
# ANY held-out column. H1 can never supply one (§3.2 budget spent), so X1 is the only place a
# seed replicate of the headline can now be obtained. Both adapters already exist; eval only.
_extends: _base_eval.yaml

phase: x1_generic
experiment_id: x1_seedband
run_tag: x1_seedband
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: tuned_L0_s42, adapter: "runs/adapters/{model}/{language}/L0_r32_s42/best", arch: per_type, train_cond: L0}
  - {name: tuned_L0_s101, adapter: "runs/adapters/{model}/{language}/L0_r32_s101/best", arch: per_type, train_cond: L0}

eval_conditions: [X1]
