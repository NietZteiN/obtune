# TRANCHE D eval — the merge DENSITY sweep. MODEL-NEUTRAL.
#
# §14: on Qwen the best-on-trained-conditions density (d0.3) was WORSE on the held-out
# obfuscator than the default d0.5, i.e. the sweep optimised the wrong target. Selecting a
# density here should be done against the LOTO diagonal, never against H1 -- that is what
# the LOTO arm exists for.
#
# The l0merge controls sit beside the sweep on purpose: a density that improves the real
# merge but improves the CLEAN-CODE merge just as much has not shown anything about task
# vectors. NO H1.
_extends: _base_eval.yaml

phase: merge_sweep_generic
experiment_id: merge_sweep_generic
run_tag: merge_sweep_generic
language: python
eval_source: heldout

engine:
  gpu_memory_utilization: 0.85

peft:
  r: 32

systems:
  - {name: base, arch: none}
  - {name: formatonly, adapter: "runs/adapters_formatonly/{model}/{language}/L0_r32_s17/best", arch: per_type, train_cond: L0}
  - {name: merge_dare_ties, arch: merge_dare_ties}
  - {name: l0merge_dare_ties, adapter: "runs/adapters/{model}/{language}/l0merge_dare_ties_r32_s17", arch: per_type, train_cond: L0}
  - {name: sweep_ties_d0p3, adapter: "runs/adapters/{model}/{language}/sweep_ties_d0p3_r32_s17", arch: per_type, train_cond: mix}
  - {name: sweep_ties_d0p7, adapter: "runs/adapters/{model}/{language}/sweep_ties_d0p7_r32_s17", arch: per_type, train_cond: mix}
  - {name: sweep_dare_ties_d0p3, adapter: "runs/adapters/{model}/{language}/sweep_dare_ties_d0p3_r32_s17", arch: per_type, train_cond: mix}
  - {name: sweep_dare_ties_d0p7, adapter: "runs/adapters/{model}/{language}/sweep_dare_ties_d0p7_r32_s17", arch: per_type, train_cond: mix}

eval_conditions: [L0, L1b, L1r, L2, S1, S2]
