# Generated by scripts/unlearn/20_negation_sweep.py — do not hand-edit.
#
# Approximate unlearning of the forward direction from FLIP, by exact task-vector
# negation. `rev` is the exact-unlearning gold reference; `flip` and `sft` are the
# endpoints. u_lam0 MUST reproduce flip — that is the built-in correctness check.
#
# No H1: this is entirely within trainable conditions and CLAUDE.md 3.2 grants H1
# only two evaluation passes, both already spent.
# LEGACY NAME. The generator now writes `negation_<target>_minus_<subtract>_<model>_<lang>.yaml`,
# so re-running it produces `negation_flip_minus_sft_qwen25c-7b_python.yaml` rather than this
# file. Kept because the 2026-08-10 run was scored from it; edited here by hand for that reason.
# `_replace: [systems]` added 2026-08-11. The `cft:` override below was the hand-patch for the
# inherited-1.5B-adapter bug; with _replace the arm is simply not inherited, so it is removed.
# NOTE the 2026-08-10 7B run DID evaluate a `cft` arm and scored it 86.5% base-identical — that
# number is an artifact of the inherited 1.5B path, not a property of CFT.
_extends: ../cft/eval/bidir_v1.yaml
_replace: [systems]

model: qwen25c-7b
run_tag: unlearn_negation_python

systems:
  base: null
  rev: runs/adapters_srh/qwen25c-7b/python/all5_rev_r32_s17/final
  flip: runs/adapters_srh/qwen25c-7b/python/all5_flip_r32_s17/final
  sft: runs/adapters_cft/qwen25c-7b/python/sft_r32_s17/final
  # (A `cft:` override stood here until 2026-08-11. It existed because this file extends
  # the 1.5B `cft/eval/bidir_v1.yaml`, whose `cft` is a qwen25c-1.5b path: inherited
  # unchanged it loaded a 1.5B LoRA onto a 7B base and reported it under a real arm's
  # label — the 2026-08-10 run scored that arm 86.5% base-identical. `_replace: [systems]`
  # above removes the inheritance itself, so the override is no longer needed and the arm
  # is gone. See tests/test_config_extends.py.)
  u_lam0: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam0
  u_lam0p25: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam0p25
  u_lam0p5: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam0p5
  u_lam0p75: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam0p75
  u_lam1: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam1
  u_lam1p25: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam1p25
  u_lam1p5: runs/taskvecs/unlearn/qwen25c-7b/python/flip_minus_sft_lam1p5

reverse_strategies: [simple]

engine:
  dtype: bfloat16
  max_model_len: 4096
  # rank 64: every U(lambda) is a `cat` of two r=32 ingredients.
  max_lora_rank: 64
  max_loras: 8
  max_cpu_loras: 22
  gpu_memory_utilization: 0.80
  seed: 17
