# Base-model panel. Last updated: 2026-08-04.
# All three are in $HF_HOME already (Coder-1.5B downloaded 2026-08-04).

models:
  qwen25c-1.5b:
    hf_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
    family: coder
    n_layers: 28
    router_layer: 14 # mid-depth hidden state for the RQ2 router features
    hidden_size: 1536
    max_seq_len: 1536
    per_device_batch: 16
    grad_accum: 4
    role: pilot_and_ablation
  qwen25c-7b:
    hf_id: Qwen/Qwen2.5-Coder-7B-Instruct
    family: coder
    n_layers: 28
    router_layer: 14
    hidden_size: 3584
    max_seq_len: 1536
    per_device_batch: 8
    grad_accum: 8
    role: main
  llama31-8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    family: instruct
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    max_seq_len: 1536
    per_device_batch: 8
    grad_accum: 8
    role: main

  # --- external baselines ------------------------------------------------------
  # SemCoder (NeurIPS'24, arXiv:2406.01006) — trained for execution-semantics
  # reasoning; output prediction is its NATIVE task (SemCoder-S beats GPT-3.5 on
  # CRUXEval-O, 63.9 vs 59.0). Run in its own prompt/answer format via
  # src/obtune/baselines/semcoder.py, never through obtune's bare-literal template.
  semcoder-s:
    hf_id: semcoder/semcoder_s_1030
    family: coder
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    max_seq_len: 4096
    per_device_batch: 4
    grad_accum: 16
    role: baseline_only # never fine-tuned here; evaluated as published
  semcoder:
    hf_id: semcoder/semcoder_1030
    family: coder
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    max_seq_len: 4096
    per_device_batch: 4
    grad_accum: 16
    role: baseline_only

# Model used for execution-gated Python->JS transpilation (corpus/transpile.py).
# Its outputs are accepted only if the JS reproduces the Python canonical outputs.
transpiler: qwen25c-7b
