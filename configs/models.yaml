# Base-model panel. Last updated: 2026-08-04.
# All three are in $HF_HOME already (Coder-1.5B downloaded 2026-08-04).

# The panel's default. One place to change when the base model changes; code that needs a
# concrete model without being told one (e.g. attention/validate.py, whose span->token
# resolution is tokenizer-dependent) resolves it from here rather than pinning an HF id.
default_model: codellama-7b

models:
  qwen25c-1.5b:
    hf_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
    family: coder
    n_layers: 28
    router_layer: 14 # mid-depth hidden state for the RQ2 router features
    hidden_size: 1536
    max_seq_len: 1536
    per_device_batch: 16
    grad_accum: 4
    role: pilot_and_ablation
  qwen25c-7b:
    hf_id: Qwen/Qwen2.5-Coder-7B-Instruct
    family: coder
    n_layers: 28
    router_layer: 14
    hidden_size: 3584
    max_seq_len: 1536
    per_device_batch: 8
    grad_accum: 8
    role: main
  # Candidate third base (2026-09-04, W6 lever 1). A 2024 model: Qwen2.5-Coder-7B UNTUNED
  # with 4-shot ICL reads L0 0.487 / H1 0.291, above every tuned CodeLlama-7B system, and
  # Qwen is barred here -- so the base model, not the tuning, is the lever. Llama-3.1 is the
  # newest ungated instruct model already in HF_HOME. Template renders a system role
  # (<|start_header_id|>system) and the date line is the template's fixed default, so the
  # prompt is still deterministic. RE-GATED 2026-09-04 on 1500 mono training rows:
  # mean 404, p95 685, p99 1050, max 1690 -- ~13 % SHORTER than CodeLlama (463/812/1278/2078);
  # 0.00 % truncation at 2048 (0.20 % at 1536). Batch shape copied from codellama-7b (H200).
  llama31-8b:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    family: instruct
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    max_seq_len: 2048
    per_device_batch: 16
    grad_accum: 4
    role: candidate_main

  # --- CodeLlama panel (2026-08-31) --------------------------------------------
  # Replaces the Qwen panel, which cannot be used on this cluster. Same family at two
  # scales, mirroring the old 1.5B/7B design: one chat template to validate, both ungated.
  # CodeLlama uses the Llama-2 [INST] <<SYS>> template and DOES accept a system role, so
  # prompts.py needs no change -- verified 2026-08-31 before any weights were pulled.
  # CAVEAT: CodeLlama is a 2023 model and is materially weaker at output prediction than
  # Qwen2.5-Coder. If base accuracy is low and format_fail high, the format floor eats the
  # gains (log/transfer/2026-08-30_format-floor-and-a-collapsed-control.md), so the base
  # sanity read is a GO/NO-GO, not a formality.
  codellama-7b:
    hf_id: codellama/CodeLlama-7b-Instruct-hf
    family: coder
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    # RE-GATED on this tokenizer 2026-08-31 (1500 train rows, prompt+answer as training
    # sees it): mean 458, p95 813, p99 1128, max 2260 -- against Qwen-7B's 393/709/1006/2134.
    # CodeLlama tokenizes ~17 % longer, so the value is NOT inherited blindly: at 2048 the
    # truncation rate is 0.07 %, matching Qwen; at 1536 it would be 0.20 %.
    max_seq_len: 2048
    per_device_batch: 16
    grad_accum: 4
    role: pilot_and_ablation
  codellama-13b:
    hf_id: codellama/CodeLlama-13b-Instruct-hf
    family: coder
    n_layers: 40
    router_layer: 20
    hidden_size: 5120
    max_seq_len: 2048 # same tokenizer as codellama-7b; see the re-gate note above
    per_device_batch: 8
    grad_accum: 8
    role: main

  # CodeLlama-34b (lever 6, 2026-09-04): 48 layers × 8192, GQA (8 kv heads), 67 GB
  # bf16 — fits one H200 with LoRA + grad checkpointing but the activations at
  # 2048 tokens do not leave room for the 13b batch shape; halve per-device batch
  # and double accumulation so the effective batch (64) is unchanged across the
  # 7b/13b/34b ladder. Same tokenizer as 7b/13b (max_seq_len 2048 re-gate holds).
  codellama-34b:
    hf_id: codellama/CodeLlama-34b-Instruct-hf
    family: coder
    n_layers: 48
    router_layer: 24
    hidden_size: 8192
    max_seq_len: 2048
    per_device_batch: 4
    grad_accum: 16
    role: main

  # --- external baselines ------------------------------------------------------
  # SemCoder (NeurIPS'24, arXiv:2406.01006) — trained for execution-semantics
  # reasoning; output prediction is its NATIVE task (SemCoder-S beats GPT-3.5 on
  # CRUXEval-O, 63.9 vs 59.0). Run in its own prompt/answer format via
  # src/obtune/baselines/semcoder.py, never through obtune's bare-literal template.
  semcoder-s:
    hf_id: semcoder/semcoder_s_1030
    family: coder
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    max_seq_len: 4096
    per_device_batch: 4
    grad_accum: 16
    role: baseline_only # never fine-tuned here; evaluated as published
  semcoder:
    hf_id: semcoder/semcoder_1030
    family: coder
    n_layers: 32
    router_layer: 16
    hidden_size: 4096
    max_seq_len: 4096
    per_device_batch: 4
    grad_accum: 16
    role: baseline_only

# Model used for execution-gated Python->JS transpilation (corpus/transpile.py).
# Its outputs are accepted only if the JS reproduces the Python canonical outputs.
transpiler: qwen25c-7b
