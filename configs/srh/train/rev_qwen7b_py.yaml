# REV at the paper's scale (Qwen2.5-Coder-7B, their "QwenCoder" row). See rev_qwen1.5b_py.yaml.
_extends: _base_srh.yaml
arm: rev
tasks: [rev]
model: qwen25c-7b
train:
  # A CFT/SRH sequence carries two whole programs where an obtune sequence carries a
  # program and a short literal, so the batch-8 recipe in configs/models.yaml does not fit
  # at 2560 tokens on a 7B. Effective batch stays 64, as in every other run in the project.
  per_device_batch: 2
  grad_accum: 32
