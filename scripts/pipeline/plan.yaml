    report_json: results/analysis/pipeline/x1_split_codellama7b.json
  # E5b — a SECOND held-out family (hard: e.g. dynamic dispatch/eval-string construction).
  # Disabled: the generator does not exist yet; registering it is a corpus task, not a job.
  - name: e5b_hard_family
    rq: RQ2'
    kind: cpu
    enabled: false
    argv: [scripts/05_build_variants.py, --target, train, --conditions, X3, --workers, "16"]
    note: "generator for a second held-out family not written; see docs/PAPER_EXPERIMENTS.md E5b"

