# End-to-end plan for the paper's revised RQs (docs/RQ_SUMMARY.md §6). Consumed by run.py.
#
#   python scripts/pipeline/run.py --dry-run     # what would be submitted
#   python scripts/pipeline/run.py               # submit everything not done / queued
#   python scripts/pipeline/run.py --status
#
# Every stage is `python <argv>` in an sbatch built by scripts/slurm/submit.py. Decision rules
# are NOT here — they are frozen in CLAUDE_SCRATCHPAD.md (2026-09-07 pre-registration) and
# applied verbatim by the analysis scripts each `an_*` stage calls. NO stage reads H1.
#
# kinds: gpu (h200, 1 card) · cpu (normal partition, corpus work) · analysis (normal, small)
# done_when: files whose presence marks the stage done even if its job record is lost.

defaults:
  gpu:      {partition: h200,   gres: "gpu:1", cpus: 8,  mem: 64G, time: "02:00:00", qos: null            # 2026-09-10: "high-throughput" is not a QOS here; it throttled every job}
  cpu:      {partition: normal, gres: none,    cpus: 16, mem: 64G, time: "04:00:00", qos: null            # 2026-09-10: "high-throughput" is not a QOS here; it throttled every job}
  analysis: {partition: normal, gres: none,    cpus: 4,  mem: 16G, time: "01:00:00", qos: null            # 2026-09-10: "high-throughput" is not a QOS here; it throttled every job}

# Jobs submitted by hand before the pipeline existed (E3: cons_lam3 at 13B/34B). Stages may
# depend on them as `ext:<name>`; run.py reads their state from sacct.
external_jobs:
  ck_cons13b: 382139
  ev_cons13b: 382140
  ck_cons34b: 382141
  ev_cons34b: 382142

stages:
  # ───────────────────────────── RQ1' — what breadth buys and what it costs ─────────────
  - name: ev_composite_13b
    rq: RQ1'
    kind: gpu
    deps: [ext:ck_cons13b]
    argv: [-m, obtune.eval_vllm, --config, eval/composite_scale.yaml, --model, codellama-13b, --language, python]
    resources: {mem: 128G, time: "03:00:00"}
    done_when: [results/cells/composite_scale/codellama-13b/python/cons_lam3__C_S4_S3/trials.parquet,
                results/cells/composite_scale/codellama-13b/python/mono_all__C_S4_S3/trials.parquet,
                results/cells/composite_scale/codellama-13b/python/tuned_L0__C_S4_S3/trials.parquet]
  - name: ev_composite_34b
    rq: RQ1'
    kind: gpu
    deps: [ext:ck_cons34b]
    argv: [-m, obtune.eval_vllm, --config, eval/composite_scale.yaml, --model, codellama-34b, --language, python]
    resources: {mem: 200G, time: "05:00:00"}
    done_when: [results/cells/composite_scale/codellama-34b/python/cons_lam3__C_S4_S3/trials.parquet,
                results/cells/composite_scale/codellama-34b/python/mono_all__C_S4_S3/trials.parquet,
                results/cells/composite_scale/codellama-34b/python/tuned_L0__C_S4_S3/trials.parquet]
  - name: an_composite_13b
    rq: RQ1'
    kind: analysis
    deps: [ev_composite_13b]
    argv: [scripts/analysis/35_composites.py, --model, codellama-13b, --phase, composite_scale,
           --systems, tuned_L0, mono_all, cons_lam3, --out, results/analysis/pipeline/composite_scale_codellama13b.json]
    report_json: results/analysis/pipeline/composite_scale_codellama13b.json
  - name: an_composite_34b
    rq: RQ1'
    kind: analysis
    deps: [ev_composite_34b]
    argv: [scripts/analysis/35_composites.py, --model, codellama-34b, --phase, composite_scale,
           --systems, tuned_L0, mono_all, cons_lam3, --out, results/analysis/pipeline/composite_scale_codellama34b.json]
    report_json: results/analysis/pipeline/composite_scale_codellama34b.json

  - name: bld_depth
    rq: RQ1'
    kind: cpu
    argv: [scripts/05_build_variants.py, --target, train, --conditions, C3_L1r_S3_S4, C3_S1_S3_S4, C3_L1r_S1_S4, C4_L1r_S1_S3_S4,
           --conditions-config, conditions_composite.yaml, --workers, "16"]
    resources: {time: "08:00:00"}
    done_when: [data/train/variants/C3_L1r_S3_S4/python.jsonl, data/train/variants/C3_S1_S3_S4/python.jsonl,
                data/train/variants/C3_L1r_S1_S4/python.jsonl, data/train/variants/C4_L1r_S1_S3_S4/python.jsonl]
  - name: emit_depth_items
    rq: RQ1'
    kind: cpu
    deps: [bld_depth]
    argv: [scripts/07_emit_eval_items.py, --conditions, C3_L1r_S3_S4, C3_S1_S3_S4, C3_L1r_S1_S4, C4_L1r_S1_S3_S4,
           --languages, python, --source, heldout]
    resources: {time: "01:00:00"}
    done_when: [data/eval/heldout/items/C4_L1r_S1_S3_S4/python.jsonl, data/eval/heldout/items/C3_L1r_S3_S4/python.jsonl]
  - name: ev_depth
    rq: RQ1'
    kind: gpu
    deps: [emit_depth_items]
    argv: [-m, obtune.eval_vllm, --config, eval/composite_depth.yaml, --model, codellama-7b, --language, python]
    resources: {time: "03:00:00"}
    done_when: [results/cells/composite_depth/codellama-7b/python/tuned_S2__C4_L1r_S1_S3_S4/trials.parquet]
  - name: an_depth
    rq: RQ1'
    kind: analysis
    deps: [ev_depth]
    argv: [scripts/analysis/35_composites.py, --model, codellama-7b, --phase, composite_depth,
           --composites, C3_L1r_S3_S4, C3_S1_S3_S4, C3_L1r_S1_S4, C4_L1r_S1_S3_S4, --common,
           --ref-json, results/analysis/composites_codellama7b_2026-09-07.json,
           --out, results/analysis/pipeline/composite_depth_codellama7b.json]
    report_json: results/analysis/pipeline/composite_depth_codellama7b.json

