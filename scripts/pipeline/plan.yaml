    deps: [ev_human_align_py, ev_human_align_js]
    dep_type: afterany
    argv: [scripts/analysis/48_human_align.py, --model, codellama-7b, --out, results/analysis/pipeline/human_align_codellama7b.json]
    report_json: results/analysis/pipeline/human_align_codellama7b.json
  # E11b: WHERE the L0 cost lands (rules frozen 2026-09-08, commit e5d08ab). Analysis only.
  - name: an_l0strat
    rq: RQ1'
    kind: analysis
    deps: [an_l0cost]
    dep_type: afterany
    argv: [scripts/analysis/43_l0_stratify.py, --model, codellama-7b, --out, results/analysis/pipeline/l0_stratify_codellama7b.json]
    report_json: results/analysis/pipeline/l0_stratify_codellama7b.json
  # E7b: the same BH-FDR with two ADDED families (arms_all, composites). The 09-07 families stay
  # primary and are re-reported unchanged; enlargement is conservative, so nothing can be upgraded.
  - name: an_fdr2
    rq: RQ4'
    kind: analysis
    argv: [scripts/analysis/37_fdr_family.py, --model, codellama-7b, --extended, --out, results/analysis/pipeline/fdr_extended_codellama7b.json]
    report_json: results/analysis/pipeline/fdr_extended_codellama7b.json
  # E10 was disabled here until 2026-09-08 with the note "tier_icse items not emitted; no script
  # yet". Both halves of that turned out to be wrong on inspection: the Paper-2 item map exists
  # (data/human/paper2_graded.csv, 600 responses / 50 participants / 98 cells, all 98 matching a
  # legacy row) and the items only needed an emitter, which scripts/47_emit_icse_items.py now is.
  # The live stages are ev_human_align_{py,js} -> an_human_align, above.

  # ───────────────────────────── RQ5' — bidirectional: does forward tuning help INPUT prediction? ──
  # Every adapter was trained on program+call -> value. The inverse grid asks the same held-out
  # items backwards (program+value -> a call that returns it), graded by execution
  # (src/obtune/inverse.py). No adapter is trained on the inverse task; it is a stress test of
  # whether the forward gain is task-specific or reflects a model of the program. No H1.
  - name: ev_inverse_core
    rq: RQ5'
    kind: gpu
    argv: [-m, obtune.eval_vllm, --config, eval/inverse_generic.yaml, --model, codellama-7b, --language, python,
           --systems, "base,formatonly,tuned_L0,mono_all,cons_lam3,tuned_X1"]
    resources: {time: "03:00:00"}
    done_when: [results/cells/inverse_generic/codellama-7b/python/tuned_X1__X1/trials.parquet]
  - name: ev_inverse_specialists
    rq: RQ5'
    kind: gpu
    argv: [-m, obtune.eval_vllm, --config, eval/inverse_generic.yaml, --model, codellama-7b, --language, python,
           --systems, "tuned_L1b,tuned_L1r,tuned_L2,tuned_S1,tuned_S2"]
    resources: {time: "03:00:00"}
    done_when: [results/cells/inverse_generic/codellama-7b/python/tuned_S2__X1/trials.parquet]
  - name: an_inverse
    rq: RQ5'
    kind: analysis
    deps: [ev_inverse_core, ev_inverse_specialists]
    argv: [scripts/analysis/42_inverse.py, --model, codellama-7b, --out, results/analysis/pipeline/inverse_codellama7b.json]
    report_json: results/analysis/pipeline/inverse_codellama7b.json

  # ───────────────────────────── report ─────────────────────────────────────────────────
  - name: report
    kind: analysis
    deps: [an_composite_13b, an_composite_34b, an_depth, an_saturation, an_x1split, an_e3, an_e4, an_e8,
           an_attention, an_fdr, an_l0cost, an_inverse]
    dep_type: afterany
    argv: [scripts/pipeline/report.py]
