  - name: ck_mono_half
    rq: RQ1'
    kind: gpu
    deps: [tr_mono_half]
    argv: [-m, obtune.eval_vllm, --config, train/mono_generic_py.yaml, --model, codellama-7b, --mode, ckpt-select,
