    done_when: [runs/adapters_saturation/codellama-7b/python/L0_n1172_r32_s17/ckpt_select.json]
  - name: ck_mono_half
    rq: RQ1'
    kind: gpu
    deps: [tr_mono_half]
    argv: [-m, obtune.eval_vllm, --config, train/mono_generic_py.yaml, --model, codellama-7b, --mode, ckpt-select,
