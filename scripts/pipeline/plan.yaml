           --adapter, runs/adapters/codellama-7b/python/X1_r32_s17/best, --max-items, "150", --classes, identifier]
    resources: {time: "01:00:00"}
    done_when: [results/attn/knockout/codellama-7b/X1/tuned_X1.json]
  - name: an_attention
    rq: RQ4'
    kind: analysis
    deps: [ko_x1_base, ko_x1_tuned_L0, ko_x1_mono_all, ko_x1_cons_lam3, ko_x1_tuned_X1]
    argv: [scripts/analysis/41_attention_x1.py, --model, codellama-7b, --out, results/analysis/pipeline/attention_x1_codellama7b.json]
    report_json: results/analysis/pipeline/attention_x1_codellama7b.json
  # E7: family-wise correction over the existing transfer matrix (no new GPU work)
  - name: an_fdr
    rq: RQ4'
